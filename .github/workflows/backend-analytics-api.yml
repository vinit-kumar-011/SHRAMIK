name: SHRAMIK backend analytics API

on:
  push:
    branches:
      - develop
      - feature/backend-analytics-read-api
    paths:
      - "backend/**"
      - ".github/workflows/backend-analytics-api.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-analytics-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shramik-backend-analytics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile backend source
        working-directory: backend
        run: python -m compileall -q app
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
