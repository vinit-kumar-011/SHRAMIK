name: Backend ingestion and API tests

on:
  push:
    branches:
      - fix/backend-api-route-integration
    paths:
      - "backend/**"
      - "data/processed/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "data/processed/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: pytest (no production credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run unit and API contract tests
        working-directory: backend
        run: python -m pytest -q
