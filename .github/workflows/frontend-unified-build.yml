name: SHRAMIK unified frontend

on:
  push:
    branches: [fix/backend-api-route-integration]
    paths:
      - 'frontend/SHRAMIK_Dashboard_Reports_Integrated_Source/SHRAMIK_Dashboard_Reports_Integrated_Source/**'
      - 'api/**'
      - 'vercel.json'
      - '.github/workflows/frontend-unified-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/SHRAMIK_Dashboard_Reports_Integrated_Source/SHRAMIK_Dashboard_Reports_Integrated_Source/**'
      - 'api/**'
      - 'vercel.json'
      - '.github/workflows/frontend-unified-build.yml'
  workflow_dispatch:

concurrency:
  group: shramik-unified-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/SHRAMIK_Dashboard_Reports_Integrated_Source/SHRAMIK_Dashboard_Reports_Integrated_Source
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/SHRAMIK_Dashboard_Reports_Integrated_Source/SHRAMIK_Dashboard_Reports_Integrated_Source/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test adapters, routes, and module integration
        run: npm test
      - name: Verify live Supabase published KPI reads
        run: npm run test:live-data
      - name: Build production application
        run: npm run build
      - name: Verify generated static entry points
        run: |
          test -s dist/index.html
          test -s dist/skill-gap-analysis.html
          test -s dist/forecasts.html
          test -s dist/reports.html
          test -d dist/assets
      - name: Smoke-test production preview routes
        run: npm run test:preview
      - name: Prepare Chromium for browser interaction QA
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          else
            npx --yes playwright install --with-deps chromium
            CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -n 1)"
            test -x "$CHROME_BIN"
            echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          fi
      - name: Validate browser QA script syntax
        run: node --check scripts/browser-interaction-qa.mjs
      - name: Run Chromium interaction and responsive QA
        run: node --experimental-websocket scripts/browser-interaction-qa.mjs
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shramik-browser-qa-screenshots
          path: frontend/SHRAMIK_Dashboard_Reports_Integrated_Source/SHRAMIK_Dashboard_Reports_Integrated_Source/browser-qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: shramik-unified-frontend
          path: frontend/SHRAMIK_Dashboard_Reports_Integrated_Source/SHRAMIK_Dashboard_Reports_Integrated_Source/dist/
          if-no-files-found: error
          retention-days: 14
