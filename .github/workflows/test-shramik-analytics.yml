name: SHRAMIK analytics pipeline tests

on:
  push:
    branches: [develop, feature/canonical-ingestion-analytics-v1]
    paths:
      - "ml/**"
      - "scripts/run_shramik_pipeline.py"
      - "scripts/generate_shramik_demo_dataset.py"
      - "tests/test_shramik_analytics_pipeline.py"
      - ".github/workflows/test-shramik-analytics.yml"
  pull_request:
    paths:
      - "ml/**"
      - "scripts/run_shramik_pipeline.py"
      - "scripts/generate_shramik_demo_dataset.py"
      - "tests/test_shramik_analytics_pipeline.py"
      - ".github/workflows/test-shramik-analytics.yml"

jobs:
  analytics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q ml scripts tests/test_shramik_analytics_pipeline.py
      - run: python -m pytest tests/test_shramik_analytics_pipeline.py -q
