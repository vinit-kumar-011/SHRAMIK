const { useState, useEffect, useRef, useCallback, useId } = React;
const mkIcon = (n) => ({ size = 24, color = 'currentColor', ...p }) => {
  const L = (window.lucide && window.lucide.icons) || {};
  const node = L[n] || L.Star || [];
  return React.createElement('svg', { xmlns: 'http://www.w3.org/2000/svg', width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', ...p },
    node.map(([t, a], i) => React.createElement(t, { key: i, ...a })));
};
const { LayoutDashboard, BarChart3, Users, Target, TrendingUp, Star, SlidersHorizontal, FileText, Database, ShieldCheck, Search, MapPin, Bell, ChevronDown, ArrowUpRight, ArrowRight, Lightbulb, Menu, X, Cpu, Leaf, Factory, HardHat, Building2, ShoppingCart, HeartPulse, Wheat, Truck, Wrench, Stethoscope, Zap, LineChart, Check, UserRound } = Object.fromEntries(["LayoutDashboard", "BarChart3", "Users", "Target", "TrendingUp", "Star", "SlidersHorizontal", "FileText", "Database", "ShieldCheck", "Search", "MapPin", "Bell", "ChevronDown", "ArrowUpRight", "ArrowRight", "Lightbulb", "Menu", "X", "Cpu", "Leaf", "Factory", "HardHat", "Building2", "ShoppingCart", "HeartPulse", "Wheat", "Truck", "Wrench", "Stethoscope", "Zap", "LineChart", "Check", "UserRound"].map((n) => [n, mkIcon(n)]));


/* ============ ICON REGISTRY (safe: keys only, never API HTML) ============ */
const ICONS = {
  dashboard: LayoutDashboard, demand: BarChart3, supply: Users, gap: Target, forecasts: TrendingUp,
  emerging: Star, scenario: SlidersHorizontal, reports: FileText, sources: Database, quality: ShieldCheck,
  ai: Cpu, green: Leaf, data: LineChart, industrial: Zap, construction: Building2, factory: Factory,
  retail: ShoppingCart, health: HeartPulse, agri: Wheat, logistics: Truck, worker: HardHat,
  machine: Wrench, care: Stethoscope, user: UserRound,
};
const Icon = ({ k, size = 18, ...p }) => { const C = ICONS[k] || Star; return <C size={size} aria-hidden="true" {...p} />; };

/* ============ MOCK ADAPTER (all values illustrative) ============ */
const sleep = (ms, signal) => new Promise((res, rej) => {
  const t = setTimeout(res, ms);
  signal?.addEventListener('abort', () => { clearTimeout(t); rej(new DOMException('Aborted', 'AbortError')); });
});
const lat = (s) => sleep(250 + Math.random() * 250, s);
const meta = (notes) => ({ provenance: 'mock', sourceLabel: 'SHRAMIK demo dataset', updatedAt: '2026-10-14', notes });
const REGIONS = [
  { code: 'IN', name: 'India (National)', f: 1 }, { code: 'MH', name: 'Maharashtra', f: 0.12 },
  { code: 'UP', name: 'Uttar Pradesh', f: 0.1 }, { code: 'TN', name: 'Tamil Nadu', f: 0.08 },
  { code: 'KA', name: 'Karnataka', f: 0.07 }, { code: 'GJ', name: 'Gujarat', f: 0.063 },
];
const SECTIONS = {
  demand: 'Demand', supply: 'Supply', 'skill-gaps': 'Skill Gaps', forecasts: 'Forecasts', emerging: 'Emerging Skills',
  scenario: 'Scenario Simulator', reports: 'Reports', sources: 'Data Sources', quality: 'Data Quality',
  profile: 'Profile', states: 'All states', 'emerging-skills': 'Emerging Skills', 'sector-gaps': 'Skill Gaps by Sector',
  'occupation-forecasts': 'Occupation Forecasts',
};
const regionOf = (c) => REGIONS.find((r) => r.code === c) || REGIONS[0];
const M = (n) => `${n.toFixed(1)}M`;
const TREND = [[2020, 118, 98], [2021, 155, 118], [2022, 188, 148], [2023, 222, 178], [2024, 268, 240]];
const SKILLS = [['ai', 'Artificial Intelligence', 52, 'ai', 90, 'var(--navy)'], ['green', 'Green Energy Systems', 41, 'green', 72, 'var(--teal)'],
  ['data', 'Data Analysis', 37, 'data', 64, 'var(--orange)'], ['industrial', 'Industrial Automation', 33, 'industrial', 58, 'var(--navy)'],
  ['sust', 'Sustainable Construction', 29, 'construction', 50, 'var(--teal)']];
const SECTORS = [['manufacturing', 'Manufacturing', 2.8, 'factory', 88, 'var(--orange)'], ['construction', 'Construction', 1.9, 'construction', 60, 'var(--orange)'],
  ['retail', 'Retail & Trade', 1.1, 'retail', 35, 'var(--orange)'], ['healthcare', 'Healthcare', 0.8, 'health', 25, 'var(--navy)'],
  ['agriculture', 'Agriculture', 0.6, 'agri', 19, 'var(--teal)']];
const OCCS = [['construction-workers', 'Construction Workers', 22, 'worker', 60, 'var(--navy)'], ['machine-operators', 'Machine Operators', 18, 'machine', 50, 'var(--teal)'],
  ['healthcare-assistants', 'Healthcare Assistants', 16, 'care', 44, 'var(--orange)'], ['logistics', 'Logistics & Supply Chain', 15, 'logistics', 40, 'var(--navy)'],
  ['data-ai', 'Data & AI Specialists', 35, 'user', 85, 'var(--teal)']];
const RANK = { demand: [['Maharashtra', 28.4], ['Uttar Pradesh', 24.1], ['Tamil Nadu', 18.7], ['Karnataka', 16.3], ['Gujarat', 14.9]] };
const INDEX = [
  ...REGIONS.slice(1).map((r) => ({ id: r.code, type: 'region', label: r.name })),
  { id: 'ai', type: 'skill', label: 'Artificial Intelligence' }, { id: 'data', type: 'skill', label: 'Data Analysis' },
  { id: 'construction-workers', type: 'occupation', label: 'Construction Workers' },
  { id: 'manufacturing', type: 'sector', label: 'Manufacturing' }, { id: 'healthcare', type: 'sector', label: 'Healthcare' },
];
const NOTES = [{ id: 'n1', text: 'Demo data refreshed', read: false }, { id: 'n2', text: 'Skill gap view updated', read: false }, { id: 'n3', text: 'Welcome to SHRAMIK', read: true }];

const MockAdapter = {
  async getRegions(s) { await lat(s); return REGIONS.map(({ code, name }) => ({ code, name })); },
  async getProfile(s) { await lat(s); return { name: 'Arjun Mehta', role: 'Research Analyst', email: 'arjun.mehta@example.org', initial: 'A' }; },
  async getDashboard({ regionCode, periodYears, signal }) {
    await lat(signal); const f = regionOf(regionCode).f; const t = TREND.slice(-periodYears);
    const sp = (a) => a.map((v) => v * f);
    const gap = (268 - 240) * 0.2748 * f; // illustrative
    return {
      kpis: [
        { id: 'demand', iconKey: 'supply', label: 'Total Labour Demand', sub: 'Estimated workforce demand', value: 236.8 * f, formatted: M(236.8 * f), delta: '+4.2%', ctx: 'vs. last year', color: 'var(--navy)', spark: sp([10, 12, 11, 15, 14, 18, 22]) },
        { id: 'supply', iconKey: 'supply', label: 'Total Labour Supply', sub: 'Estimated workforce supply', value: 229.1 * f, formatted: M(229.1 * f), delta: '+3.1%', ctx: 'vs. last year', color: 'var(--teal)', spark: sp([9, 11, 12, 13, 15, 17, 20]) },
        { id: 'gap', iconKey: 'gap', label: 'Overall Skill Gap', sub: 'Demand — Supply', value: 7.7 * f, formatted: M(7.7 * f), delta: '+12.6%', ctx: 'vs. last year', color: 'var(--orange)', spark: sp([6, 5, 8, 7, 10, 9, 13]), valueColor: 'var(--orange)' },
        { id: 'emerging', iconKey: 'emerging', label: 'Emerging Skills', sub: 'High-growth opportunities', value: Math.round(312 * Math.max(f, 0.2)), formatted: String(Math.round(312 * Math.max(f, 0.2))), delta: '+28%', ctx: 'new this year', color: 'var(--teal)', spark: [3, 4, 4, 6, 7, 9, 12], valueColor: 'var(--teal)' },
      ].map((k) => (k.id === 'gap' ? { ...k, gapCheck: gap } : k)),
      trend: t.map(([year, demand, supply]) => ({ year, demand: demand * (f > 0.5 ? 1 : 1), supply })),
      emergingSkills: SKILLS.map(([id, label, v, iconKey, displayScore, color]) => ({ id, label, iconKey, formatted: `+${v}%`, displayScore, color })),
      sectorGaps: SECTORS.map(([id, label, v, iconKey, displayScore, color]) => ({ id, label, iconKey, formatted: M(v * f).replace(/^0\.0M$/, '<0.1M'), displayScore, color })),
      occupationForecasts: OCCS.map(([id, label, v, iconKey, displayScore, color]) => ({ id, label, iconKey, formatted: `+${v}%`, displayScore, color })),
      meta: meta('All figures are placeholders for layout and interaction testing.'),
    };
  },
  async getRegionRankings({ metric, signal }) {
    await lat(signal); const k = metric === 'supply' ? 0.96 : metric === 'skill-gap' ? 0.034 : 1;
    return { items: RANK.demand.map(([label, v], i) => ({ id: `r${i}`, label, formatted: M(v * k) })), meta: meta('Ranking values are illustrative.') };
  },
  async search({ query, signal }) {
    await lat(signal); const q = query.trim().toLowerCase();
    return q ? INDEX.filter((i) => i.label.toLowerCase().includes(q)) : [];
  },
  async getNotifications(s) { await lat(s); return NOTES.map((n) => ({ ...n })); },
  async markNotificationRead(id) { await lat(); const n = NOTES.find((x) => x.id === id); if (n) n.read = true; return { id, read: true }; },
  async getIndicatorDetail(id, { regionCode, signal } = {}) {
    await lat(signal);
    return { title: `Indicator: ${id}`, facts: [{ label: 'Region', value: regionOf(regionCode).name }, { label: 'Status', value: 'Placeholder indicator' }], table: null, meta: meta('Replace with source-backed indicator detail.') };
  },
  async getSectionDetail(section, { regionCode, signal } = {}) {
    await lat(signal);
    return {
      title: SECTIONS[section] || section,
      facts: [{ label: 'Region', value: regionOf(regionCode).name }, { label: 'Coverage', value: 'Demo only' }],
      table: { columns: ['Item', 'Illustrative value'], rows: [['Sample A', '—'], ['Sample B', '—']] },
      meta: meta('Detail view for layout testing.'),
    };
  },
};

const Sparkline = ({ data, color, id }) => {
  if (!data?.length) return null;
  const w = 130, h = 46, mx = Math.max(...data), mn = Math.min(...data), r = mx - mn || 1;
  const pts = data.map((v, i) => [(i / (data.length - 1 || 1)) * w, h - 4 - ((v - mn) / r) * (h - 10)]);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="120" height="42" aria-hidden="true" style={{ flexShrink: 0 }}>
      <defs><linearGradient id={`g-${id}`} x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor={color} stopOpacity=".25" /><stop offset="1" stopColor={color} stopOpacity="0" /></linearGradient></defs>
      <path d={`${line} L${w},${h} L0,${h} Z`} fill={`url(#g-${id})`} />
      <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" />
    </svg>
  );
};

function Header({ adapter, regions, regionCode, onRegion, profile, notes, onRead, onMenu, onPick }) {
  const [q, setQ] = useState(''); const [res, setRes] = useState([]); const [hi, setHi] = useState(-1);
  const [exp, setExp] = useState(false); const [pop, setPop] = useState(null); const [sErr, setSErr] = useState('');
  const inp = useRef(null);
  useEffect(() => {
    const k = (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setExp(true); inp.current?.focus(); } };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, []);
  useEffect(() => {
    if (!q.trim()) { setRes([]); setSErr(''); return undefined; }
    const ac = new AbortController();
    const t = setTimeout(() => {
      adapter.search({ query: q, regionCode, signal: ac.signal }).then((r) => { setRes(r); setHi(-1); setSErr(''); })
        .catch((e) => { if (e.name !== 'AbortError') setSErr('Search failed. Try again.'); });
    }, 250);
    return () => { clearTimeout(t); ac.abort(); };
  }, [q, regionCode, adapter]);
  const choose = (r) => { setQ(''); setRes([]); setExp(false); onPick(r); };
  const onKey = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setHi((h) => Math.min(h + 1, res.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setHi((h) => Math.max(h - 1, 0)); }
    else if (e.key === 'Enter' && res[hi]) choose(res[hi]);
    else if (e.key === 'Escape') { setQ(''); setRes([]); setExp(false); }
  };
  const unread = notes.filter((n) => !n.read).length;
  return (
    <header className="top">
      <button className="ibtn hamb" aria-label="Open navigation menu" onClick={onMenu}><Menu /></button>
      <div className="logo"><div className="logo-mark" aria-hidden="true">S</div><span className="logo-word">SHRAMIK</span><div className="logo-desc">LABOUR MARKET<br />INTELLIGENCE<br />SYSTEM</div></div>
      <div className="spacer" />
      <div className={`search ${exp ? 'exp' : ''}`}>
        <div className="box" onClick={() => { setExp(true); inp.current?.focus(); }}>
          <Search size={18} aria-hidden="true" />
          <input ref={inp} aria-label="Search skills, occupations, sectors or regions" placeholder="Search for skills, occupations, sectors or regions…" value={q}
            onChange={(e) => setQ(e.target.value)} onKeyDown={onKey} role="combobox" aria-expanded={res.length > 0} aria-controls="sres" aria-autocomplete="list" />
          <span className="kbd">Ctrl</span><span className="kbd">K</span>
        </div>
        {(res.length > 0 || sErr || (q.trim() && !res.length)) && q.trim() && (
          <div className="pop" id="sres" role="listbox" aria-label="Search results">
            {sErr ? <div className="empty">{sErr}</div> : res.length ? res.map((r, i) => (
              <button key={`${r.type}-${r.id}`} role="option" aria-selected={i === hi} className="opt" onClick={() => choose(r)}><span>{r.label}</span><small>{r.type}</small></button>
            )) : <div className="empty">No results yet. Try a skill, sector or state.</div>}
          </div>
        )}
      </div>
      <SelectControl label="Region" value={regionCode} onChange={onRegion} icon={<MapPin size={16} aria-hidden="true" />} options={regions.map((r) => ({ value: r.code, label: r.name }))} />
      <div style={{ position: 'relative' }}>
        <button className="ibtn" aria-label={`Notifications, ${unread} unread`} aria-expanded={pop === 'n'} onClick={() => setPop(pop === 'n' ? null : 'n')}><Bell />{unread > 0 && <span className="dot" />}</button>
        {pop === 'n' && <div className="pop" role="dialog" aria-label="Notifications" onKeyDown={(e) => e.key === 'Escape' && setPop(null)}>
          {notes.map((n) => <div className="opt" key={n.id}><span style={{ fontWeight: n.read ? 400 : 700 }}>{n.text}</span>
            {!n.read && <button className="va" onClick={() => onRead(n.id)}><Check size={14} />Mark read</button>}</div>)}
        </div>}
      </div>
      <div style={{ position: 'relative' }}>
        <button className="user" aria-expanded={pop === 'p'} aria-label="Open profile" onClick={() => setPop(pop === 'p' ? null : 'p')}>
          <span className="av" aria-hidden="true">{profile?.initial || 'A'}</span>
          <div><b>{profile?.name || '…'}</b><span>{profile?.role || ''}</span></div><ChevronDown size={16} aria-hidden="true" />
        </button>
        {pop === 'p' && <div className="pop pad" role="dialog" aria-label="Profile" onKeyDown={(e) => e.key === 'Escape' && setPop(null)}>
          <b>{profile?.name}</b><div>{profile?.role}</div><div style={{ color: 'var(--tm)' }}>{profile?.email}</div>
        </div>}
      </div>
    </header>
  );
}

function DetailDrawer({ d, onClose }) {
  const ref = useRef(null); const prev = useRef(null);
  useEffect(() => {
    prev.current = document.activeElement; ref.current?.querySelector('button')?.focus();
    return () => prev.current?.focus?.();
  }, []);
  const key = (e) => {
    if (e.key === 'Escape') { onClose(); return; }
    if (e.key !== 'Tab') return;
    const f = ref.current.querySelectorAll('button,[href],input,select,[tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    const a = f[0], z = f[f.length - 1];
    if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
    else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  };
  return (
    <div className="drawer" onClick={onClose}>
      <div className="dp" role="dialog" aria-modal="true" aria-labelledby="dp-h" ref={ref} onKeyDown={key} onClick={(e) => e.stopPropagation()}>
        <div className="ph"><h2 id="dp-h">{d.title}</h2><button className="ibtn" aria-label="Close details" onClick={onClose}><X /></button></div>
        {d.status === 'loading' && <Skeleton n={4} />}
        {d.status === 'error' && <ErrorBox msg={d.error} onRetry={d.retry} />}
        {d.status === 'ready' && <>
          <dl>{d.data.facts.map((f) => <><dt key={`${f.label}-t`}>{f.label}</dt><dd key={`${f.label}-d`}>{f.value}</dd></>)}</dl>
          {d.data.table && <table><thead><tr>{d.data.table.columns.map((c) => <th key={c}>{c}</th>)}</tr></thead>
            <tbody>{d.data.table.rows.map((r) => <tr key={r[0]}>{r.map((c, i) => <td key={i}>{c}</td>)}</tr>)}</tbody></table>}
          <div><ProvenanceBadge meta={d.data.meta} /></div>
          <div style={{ fontSize: 12, color: 'var(--tm)' }}>Source: {d.data.meta.sourceLabel} · Updated {d.data.meta.updatedAt}<br />{d.data.meta.notes}</div>
        </>}
      </div>
    </div>
  );
}

const STATES = [['UP', 'Uttar Pradesh', 5.8], ['MH', 'Maharashtra', 4.2], ['BR', 'Bihar', 2.9], ['WB', 'West Bengal', 2.7], ['TN', 'Tamil Nadu', 2.5],
  ['MP', 'Madhya Pradesh', 2.1], ['RJ', 'Rajasthan', 1.9], ['KA', 'Karnataka', 1.8], ['GJ', 'Gujarat', 1.6]];
const opt = (value, label) => ({ value, label });
const OPTIONS = {
  period: [opt('2024', '2024 (Latest)'), opt('2023', '2023'), opt('2022', '2022')],
  geography: [opt('all', 'All India'), opt('urban', 'Urban'), opt('rural', 'Rural')],
  state: [opt('', 'All States'), ...STATES.map(([c, n]) => opt(c, n))],
  sector: [opt('', 'All Sectors'), opt('construction', 'Construction'), opt('manufacturing', 'Manufacturing'), opt('it-ites', 'IT-ITES'), opt('healthcare', 'Healthcare')],
  occupation: [opt('', 'All Occupations'), opt('demo-01', 'Agricultural Labourers'), opt('demo-02', 'Retail Salespersons'), opt('demo-03', 'Construction Labourers')],
  skill: [opt('', 'All Skills'), opt('digital', 'Digital skills'), opt('technical', 'Technical skills')],
};
const DEFAULTS = { period: '2024', geography: 'all', state: '', sector: '', occupation: '', skill: '' };
const scaleOf = (f) => {
  let k = 1 - (2024 - Number(f.period)) * 0.03;
  if (f.state) k *= (STATES.find((s) => s[0] === f.state)?.[2] || 2) / 32.7;
  if (f.geography === 'urban') k *= 0.35; if (f.geography === 'rural') k *= 0.65;
  if (f.sector) k *= 0.28; if (f.occupation) k *= 0.12; if (f.skill) k *= 0.2;
  return k;
};
const snap = (f) => `demo-${Object.values(f).join('.') || 'default'}`;
const M1 = (v, s = ' Million') => `${v.toFixed(1)}${s}`;
const KP = [
  ['supply', 'Estimated Workforce Supply', 32.7, 'million persons', 5.8, 'Demo definition: estimated stock of employed persons in the selected scope.'],
  ['capacity', 'Training Capacity (Annual)', 12.4, 'million seats per year', 8.1, 'Demo definition: annual sanctioned training seats across covered schemes.'],

];

  ['demo-03', 'Construction Labourers', 2.9, 5.9, [2.2, 2.4, 2.5, 2.7, 2.9]], ['demo-04', 'Teaching Professionals', 1.8, 7.1, [1.2, 1.3, 1.5, 1.6, 1.8]],

const SEC = [['construction', 'Construction', 3.1, 78, 9.2], ['manufacturing', 'Manufacturing', 2.4, 74, 8.6], ['it-ites', 'IT-ITES', 1.8, 69, 11.4],
  ['healthcare', 'Healthcare', 1.2, 71, 10.1], ['agri', 'Agriculture and Allied', 1.0, 63, 5.7]];
const MET = { 'workforce-supply': ['Workforce Supply', 1, 'million persons'], 'training-capacity': ['Training Capacity', 0.38, 'million seats per year'], 'training-completions': ['Training Completions', 0.26, 'million candidates per year'] };
const YEARS = [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026];

const SupplyMock = {
  async getFilterOptions(signal) { await lat(signal); return { options: OPTIONS, defaults: DEFAULTS, meta: sm() }; },
  async getOverview({ filters, signal }) {
    await lat(signal); const k = scaleOf(filters); const prev = String(Number(filters.period) - 1);
    return {
      snapshotId: snap(filters), meta: sm(),
      kpis: KP.map(([id, label, v, unit, d, definition]) => ({ id, label, value: v * k, formatted: M1(v * k), unit, period: filters.period, definition,
        delta: d == null ? null : { formatted: `+${d}%`, basis: `vs ${prev}` } })),
      topOccupations: OCC.map(([id, label, v, g, sp]) => ({ id, code: id.toUpperCase(), label, formatted: M1(v * k, 'M'), growth: `+${g}%`, spark: sp.map((x) => x * k) })),
      topTrainingSectors: SEC.map(([id, label, c, u, g]) => ({ id, label, capacity: M1(c * k, 'M'), utilisation: `${u}%`, growth: `+${g}%` })),
    };
  },
  async getTrend({ view, filters, signal }) {
    await lat(signal); const k = scaleOf(filters);
    const mk = (id, label, color, unit, vals, obs, band) => ({ id, label, color, unit, points: YEARS.slice(0, vals.length).map((p, i) => {
      const o = i < obs, v = vals[i]; return { period: p, value: v, kind: o ? 'observed' : 'forecast', lower: !o && band ? v - band * (i - obs + 1) : null, upper: !o && band ? v + band * (i - obs + 1) : null }; }) });
    const views = [opt('workforce', 'Workforce supply (stock)'), opt('training', 'Training flows (annual)'), opt('formal', 'Formal employment indicator')];
    let series;
    if (view === 'training') series = [mk('cap', 'Training capacity', 'var(--orange)', 'million seats per year', [7.6, 7.9, 9, 10, 11.1, 12.4].map((x) => x * k), 6), mk('cmp', 'Training completions', 'var(--teal)', 'million candidates per year', [3.8, 4.1, 5.2, 6, 7.4, 8.6].map((x) => x * k), 6)];
    else if (view === 'formal') series = [mk('frm', 'Formal employment share', 'var(--navy)', '% of workforce', [51, 52, 53.5, 55, 56.2, 57.8], 6)];
    else series = [mk('wf', 'Workforce supply (estimated stock)', 'var(--navy)', 'million persons', [27.1, 27.9, 28.8, 30.9, 31.0, 32.7, 34.1, 35.4].map((x) => x * k), 6, 0.5 * k)];
    return { views, view: view || 'workforce', series, meta: sm({ notes: view === 'workforce' || !view ? 'Forecast values and intervals are demo values from a mock forecasting service.' : 'Observed demo history only.' }), snapshotId: snap(filters) };
  },
  async getRegions({ metric, filters, signal }) {
    await lat(signal); const [name, mf, unit] = MET[metric] || MET['workforce-supply']; const k = scaleOf({ ...filters, state: '' });
    const rows = STATES.map(([c, n, v]) => ({ stateCode: c, label: n, value: v * mf * k })); const known = rows.reduce((a, r) => a + r.value, 0); const total = known / 0.78;
    const mx = Math.max(...rows.map((r) => r.value));

function useRes(load, deps) {
  const [s, set] = useState({ status: 'loading' }); const [n, setN] = useState(0);
  useEffect(() => {
    const ac = new AbortController();
    set((p) => (p.data ? { ...p, status: 'refreshing' } : { status: 'loading' }));
    load(ac.signal).then((data) => set({ status: 'ready', data }))
      .catch((e) => { if (e.name !== 'AbortError') set((p) => ({ ...p, status: 'error', error: e.message || 'Request failed' })); });
    return () => ac.abort();
  }, [...deps, n]); // eslint-disable-line
  return [s, () => setN((x) => x + 1)];
}
const Body = ({ s, retry, rows = 4, children }) => {
  if (s.status === 'loading') return <Skeleton n={rows} />;
  if (!s.data) return <ErrorBox msg={`This panel could not load. ${s.error || ''}`} onRetry={retry} />;
  return <>{s.status === 'error' && <div className="stale" role="alert">Stale: showing last successful data. <button onClick={retry}>Retry</button></div>}{children(s.data)}</>;
};

};

function SupplyTrend({ s, retry, view, onView }) {

      <Body s={s} retry={retry} rows={6}>{(d) => {
        const W = 620, H = 270, L = 48, R = 20, T = 14, B = 34;
        const periods = d.series[0].points.map((p) => p.period);
        const allv = d.series.flatMap((x) => x.points.flatMap((p) => [p.value, p.upper ?? p.value]));
        const mx = Math.max(...allv) * 1.12; const step = mx > 60 ? 20 : mx > 25 ? 10 : mx > 10 ? 5 : 2; const top = Math.ceil(mx / step) * step;
        const ticks = []; for (let t = 0; t <= top; t += step) ticks.push(t);
        const X = (i) => L + (i / (periods.length - 1 || 1)) * (W - L - R); const Y = (v) => T + (1 - v / top) * (H - T - B);
        const lastObs = (x) => x.points.filter((p) => p.kind === 'observed').length - 1;
        const hasF = d.series.some((x) => x.points.some((p) => p.kind === 'forecast'));
        const unitOf = d.series.map((x) => x.unit).filter((u, i, a) => a.indexOf(u) === i).join(' / ');

          <div className="lvl">{d.series.map((x) => <span key={x.id}><i style={{ borderColor: x.color }} />{x.label}</span>)}{hasF && <span><i style={{ borderColor: '#62625C', borderTopStyle: 'dashed' }} />Forecast</span>}</div>
          <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label={`Line chart, ${d.series.map((x) => x.label).join(' and ')}, ${periods[0]} to ${periods[periods.length - 1]}, unit ${unitOf}. A data table alternative is available below. Illustrative data.`}>
            {ticks.map((t) => <g key={t}><line x1={L} x2={W - R} y1={Y(t)} y2={Y(t)} stroke="var(--bm)" /><text x={L - 8} y={Y(t) + 4} textAnchor="end" fontSize="12">{t}</text></g>)}
            {periods.map((p, i) => <text key={p} x={X(i)} y={H - 10} textAnchor="middle" fontSize="12">{p}</text>)}
            <text x="4" y="12" fontSize="11" fill="#62625C">{unitOf}</text>
            {hasF && (() => { const i = lastObs(d.series[0]); return <g><line x1={X(i)} x2={X(i)} y1={T} y2={H - B} stroke="#62625C" strokeDasharray="3 4" /><text x={X(i) + 6} y={T + 10} fontSize="11" fill="#62625C">Forecast →</text></g>; })()}
            {d.series.map((x) => { const i0 = lastObs(x); const obs = x.points.slice(0, i0 + 1); const fc = x.points.slice(i0);
              const band = fc.length > 1 && fc.every((p, j) => j === 0 || p.lower != null);
              return (<g key={x.id}>
                {band && <polygon fill={x.color} opacity=".15" points={[...fc.map((p, j) => `${X(i0 + j)},${Y(j === 0 ? p.value : p.upper)}`), ...fc.map((p, j) => `${X(i0 + j)},${Y(j === 0 ? p.value : p.lower)}`).reverse()].join(' ')} />}
                <path d={obs.map((p, j) => `${j ? 'L' : 'M'}${X(j)},${Y(p.value)}`).join(' ')} fill="none" stroke={x.color} strokeWidth="3" />
                {fc.length > 1 && <path d={fc.map((p, j) => `${j ? 'L' : 'M'}${X(i0 + j)},${Y(p.value)}`).join(' ')} fill="none" stroke={x.color} strokeWidth="3" strokeDasharray="7 5" />}
                {x.points.map((p, j) => <circle key={p.period} cx={X(j)} cy={Y(p.value)} r="5" tabIndex={0} fill={p.kind === 'observed' ? x.color : '#fff'} stroke={x.color} strokeWidth="2"
                  aria-label={`${p.period} ${x.label} ${p.value.toFixed(1)} ${x.unit}, ${p.kind}`}
                  onMouseEnter={() => setTip({ x: (X(j) / W) * 100, y: (Y(p.value) / H) * 100, p, x })} onFocus={() => setTip({ x: (X(j) / W) * 100, y: (Y(p.value) / H) * 100, p, x })}
                  onMouseLeave={() => setTip(null)} onBlur={() => setTip(null)} />)}</g>); })}
          </svg>
          {tip && <div className="tip" role="status" style={{ left: `${tip.x}%`, top: `${tip.y}%` }}>{tip.p.period} · {tip.x.label}: {tip.p.value.toFixed(1)} {tip.x.unit} · {tip.p.kind}{tip.p.lower != null ? ` (${tip.p.lower.toFixed(1)} to ${tip.p.upper.toFixed(1)})` : ''} · {d.meta.provenance}</div>}
          <button className="dtog" aria-expanded={tbl} onClick={() => setTbl(!tbl)}>{tbl ? 'Hide data table' : 'Show data table'}</button>
          {tbl && <div className="tw"><table className="tbl"><caption className="vh">Trend data table</caption><thead><tr><th>Period</th>{d.series.map((x) => <th key={x.id}>{x.label} ({x.unit})</th>)}<th>Status</th></tr></thead>
            <tbody>{periods.map((p, i) => <tr key={p}><td>{p}</td>{d.series.map((x) => <td key={x.id}>{x.points[i].value.toFixed(1)}</td>)}<td>{d.series[0].points[i].kind}</td></tr>)}</tbody></table></div>}
          <div className="sel-note">{d.meta.notes}</div></div>);
      }}</Body>
    </section>
  );
}

          <div className="kpis">
            {ov.status === 'loading' ? Array.from({ length: 4 }, (_, i) => <div className="card" key={i}><Skeleton n={3} /></div>)
              : !ovd ? <div style={{ gridColumn: '1/-1' }}><ErrorBox msg="Key indicators could not load." onRetry={retryOv} /></div>
              : ovd.kpis.map((k) => <SupplyKpi key={k.id} k={k} onOpen={(id) => detail(id, k.label)} />)}
          </div>
          {ov.status === 'error' && ovd && <div className="stale" role="alert">Indicators are stale. <button onClick={retryOv}>Retry</button></div>}
          <div className="mid2">
            <SupplyTrend s={tr} retry={retryTr} view={view} onView={setView} />
            <RegionPanel s={rg} retry={retryRg} metric={metric} onMetric={setMetric} selected={applied.state} onState={drill} onAll={() => detail('all-states')} />
          </div>
          <div className="low">
            <Panel id="to" title="Top Occupations by Supply" sub={`Estimated workforce supply and growth (${applied.period})`} s={ov} retry={retryOv} onAll={() => detail('all-occupations')} allLabel="View All Occupations">
              {(d) => <div className="tw"><table className="tbl"><thead><tr><th>#</th><th>Occupation</th><th>Supply</th><th>Growth</th><th>Trend</th></tr></thead>
                <tbody>{d.topOccupations.map((o, i) => <tr key={o.id}><td>{i + 1}</td><td><button className="lk" onClick={() => detail(o.id, o.label)}>{o.label}</button><small>NCO {o.code} (demo)</small></td>
                  <td>{o.formatted}</td><td className="pos">{o.growth}</td><td><Sparkline data={o.spark} color="var(--navy)" id={o.id} /></td></tr>)}</tbody></table></div>}
            </Panel>
            <Panel id="ts" title="Top Training Sectors by Capacity" sub={`Annual training capacity and utilisation (${applied.period})`} s={ov} retry={retryOv} onAll={() => detail('all-sectors')} allLabel="View All Sectors">
              {(d) => <div className="tw"><table className="tbl"><thead><tr><th>#</th><th>Sector</th><th>Capacity</th><th>Utilisation</th><th>Growth</th></tr></thead>
                <tbody>{d.topTrainingSectors.map((o, i) => <tr key={o.id}><td>{i + 1}</td><td><button className="lk" onClick={() => detail(o.id, o.label)}>{o.label}</button></td>
                  <td>{o.capacity}</td><td>{o.utilisation}</td><td className="pos">{o.growth}</td></tr>)}</tbody></table>
                <div className="sel-note">Utilisation = completions ÷ sanctioned seats (demo definition, backend-owned).</div></div>}
            </Panel>
            <Panel id="si" title="Supply Insights" sub="Evidence-linked summary" s={ins} retry={retryIns}>
              {(d) => d.items.length ? <><ul className="ins">{d.items.map((it) => <li key={it.id}>{it.text}<div>{it.evidence.map((e) => <button key={e} className="chip" onClick={() => detail(e, e)}>Evidence: {e}</button>)}</div></li>)}</ul>
                <div className="method">Method: {d.method}. Generated {d.generatedAt.slice(0, 10)}.</div></> : <div className="empty">Insights are not configured or evidence is insufficient.</div>}
            </Panel>
          </div>
          <div className="foot" role="contentinfo">
            {meta && <ProvenanceBadge meta={meta} />}
            <span>{meta ? `${meta.sourceLabel}. Period ${applied.period}. Coverage: ${meta.coverage}. Updated ${meta.updatedAt}. Snapshot ${ovd?.snapshotId}.` : 'Loading provenance…'} Workforce stock and annual training flows are shown separately.</span>
            {busy && <span className="spin" role="status">Refreshing…</span>}
          </div>
        </main>
      </div>
      {drawer && <DetailDrawer d={drawer} onClose={() => setDrawer(null)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<SupplyInsightsPage />);

</script>
</body>
</html>
